name: Release

# Builds installers for macOS (universal), Windows, and Linux and attaches
# them to a draft GitHub release - push a tag like `v0.1.0` to trigger it,
# or run it manually from the Actions tab. The release is left as a draft
# so someone reviews it (and writes release notes) before publishing;
# nothing here signs the binaries, so first launches will trip Gatekeeper /
# SmartScreen warnings until code signing is set up separately.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # aws-lc-sys (pulled in transitively for TLS) needs NASM to build its
      # assembly routines on Windows.
      - name: Install NASM (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Postgres Studio ${{ github.ref_name }}"
          releaseBody: |
            See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The installers are named after productName ("Postgres Studio"), and GitHub
  # turns the space into a dot. Give them back the lowercase names the site's
  # download and apt scripts fetch (postgres-studio_<version>_<arch>.deb, ...).
  tidy-asset-names:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Rename release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.apiUrl, .name] | @tsv' |
          while IFS=$'\t' read -r url name; do
            new="${name/#Postgres.Studio/postgres-studio}"
            if [ "$new" != "$name" ]; then
              echo "$name -> $new"
              gh api -X PATCH "$url" -f name="$new" --silent
            fi
          done
